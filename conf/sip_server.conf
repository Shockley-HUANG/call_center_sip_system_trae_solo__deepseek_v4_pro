# ============================================================
#  Call Center SIP Server - 主配置文件
#  千人企业呼叫中心模拟系统
# ============================================================

# --- 服务基础配置 ---
[server]
# SIP 服务监听地址 (0.0.0.0 表示监听所有网卡)
listen_addr = 0.0.0.0
# SIP 信令端口 (标准SIP端口)
sip_port = 5060
# RTP 媒体流端口范围
rtp_port_min = 16384
rtp_port_max = 32768
# 最大并发通话数
max_concurrent_calls = 2048
# 工作线程数 (0 = 自动检测CPU核心数)
worker_threads = 0

# --- Lua 路由配置 ---
[lua]
# Lua 路由脚本路径
route_script = lua/route.lua
# IVR 脚本路径 (预留)
ivr_script = lua/ivr_menu.lua
# 支持脚本热更新
hot_reload = true
# 热更新检测间隔 (秒)
reload_interval = 5

# --- 日志配置 ---
[logging]
# 日志目录
log_dir = ./log
# 日志文件名
log_file = sip_server.log
# 日志级别: debug, info, warn, error, fatal
log_level = info
# 日志文件最大大小 (MB)
max_log_size = 100
# 保留的日志文件数量
log_backup_count = 10

# --- 400总机配置 ---
[gateway]
# 对外统一总机号码
external_number = 400-123-4567
# IVR 超时时间 (秒)
ivr_timeout = 10
# 总机最大排队人数
max_queue_size = 200

# --- 24小时人工服务台 ---
[support]
# 人工服务台总机短号
agent_number = 9000
# 坐席分机范围
agent_start = 9001
agent_end = 9050
# 坐席总数
agent_count = 50
# 排班模式: 三班倒 (A: 0-8, B: 8-16, C: 16-24)
shift_mode = three_shift
# 每班最少坐席数
min_agents_per_shift = 12

