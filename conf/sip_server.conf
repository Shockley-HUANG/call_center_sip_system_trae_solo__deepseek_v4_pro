# --- 数据库配置 (预留) ---
[database.mysql]
host = 127.0.0.1
port = 3306
user = sip_user
password = sip_password
database = call_center
pool_size = 20

[database.redis]
host = 127.0.0.1
port = 6379
password =
db = 0
pool_size = 10

# --- IVR 语音文件配置 (预留) ---
[ivr_media]
welcome_file = media/welcome.wav
music_on_hold = media/hold_music.wav
prompt_dir = media/prompts/

# --- 通话录音配置 (预留) ---
[recording]
enabled = false
record_dir = /var/recordings/
format = wav
# 保存天数
retention_days = 90